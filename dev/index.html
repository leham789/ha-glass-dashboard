<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Glass cards · preview</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #edeef1;
      font-family: 'Outfit', system-ui, sans-serif;
      color: #121316;
    }
    main {
      max-width: 390px;
      margin: 0 auto;
      padding: 32px 20px 64px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    h1 { margin: 16px 0 0; font-size: 28px; font-weight: 400; letter-spacing: -0.4px; }
    p { margin: 0; font-size: 13px; color: #5f626a; }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    #log {
      position: sticky;
      bottom: 100px;
      z-index: 6;
      min-height: 18px;
      padding: 10px 14px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.85);
    }
  </style>
</head>
<body>
  <main>
    <p>Mock Home Assistant data. Tap things; what would be sent to HA shows at the bottom.</p>
    <h1>Status chips</h1>
    <div id="chips"></div>
    <h1>Goodnight</h1>
    <div id="goodnight"></div>
    <h1>Now playing</h1>
    <div id="playing"></div>
    <h1>Around the house</h1>
    <div id="around"></div>
    <h1>Rooms</h1>
    <div id="rooms"></div>
    <h1>Light tile</h1>
    <div class="grid" id="tiles"></div>
    <p id="log">Nothing sent yet</p>
    <div id="menu"></div>
  </main>
  <script type="module" src="./main.ts"></script>
</body>
</html>
